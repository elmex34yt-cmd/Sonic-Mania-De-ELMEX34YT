        function activarFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen?.();
            }

            document.removeEventListener("click", activarFullscreen);
            document.removeEventListener("touchstart", activarFullscreen);
        }

        document.addEventListener("click", activarFullscreen);
        document.addEventListener("touchstart", activarFullscreen);
    </script>
